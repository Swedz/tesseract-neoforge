repositories {
	mavenLocal()
	maven {
		name = "Modmaven"
		url = "https://modmaven.dev"
		content {
			// Tesseract
			includeGroup "net.swedz"
			// GrandPower
			includeGroup "dev.technici4n"
			// Modern Industrialization
			includeGroup "aztech"
		}
	}
	maven {
		name = "shedaniel"
		url = "https://maven.shedaniel.me"
		content {
			// Cloth Config
			includeGroup "me.shedaniel.cloth"
		}
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
		content {
			// EMI
			includeGroup "dev.emi"
		}
	}
}

dependencies {
	jarJar(implementation("net.swedz:tesseract-api:${tesseract_version}")) {
		version {
			strictly tesseract_version_range
			prefer tesseract_version
		}
	}

