repositories {
	mavenLocal()
	maven {
		name = "Modmaven"
		url = "https://modmaven.dev"
		content {
			// Tesseract
			includeGroup "net.swedz"
			// GrandPower
			includeGroup "dev.technici4n"
			// Modern Industrialization
			includeGroup "aztech"
		}
	}
	maven {
		name = "shedaniel"
		url = "https://maven.shedaniel.me"
		content {
			// Cloth Config
			includeGroup "me.shedaniel.cloth"
		}
	}
	maven {
		name = "Sleeping Town"
		url = "https://repo.sleeping.town/"
		content {
			// EMI
			includeGroup "dev.emi"
		}
	}
}

dependencies {
	jarJar(api("net.swedz:tesseract-api:${tesseract_version}")) {
		version {
			strictly tesseract_version_range
			prefer tesseract_version
		}
	}

	if (project.runtime_include_emi.toBoolean()) {
		localImplementation "dev.emi:emi-neoforge:${emi_version}"
	} else {
		compileOnly "dev.emi:emi-neoforge:${emi_version}"
	}

	if (project.runtime_include_mi.toBoolean()) {
		localImplementation "aztech:Modern-Industrialization:${modern_industrialization_version}"
		localImplementation "dev.technici4n:GrandPower:${grandpower_version}"
	} else {
		compileOnly "aztech:Modern-Industrialization:${modern_industrialization_version}"
		compileOnly "dev.technici4n:GrandPower:${grandpower_version}"
	}
}